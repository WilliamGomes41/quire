# Self-hosted Quire with its own Postgres.
#   cp .env.example .env   # fill in keys, owner, BETTER_AUTH_URL, POSTGRES_PASSWORD
#   docker compose up -d --build
name: quire

services:
  app:
    build: .
    image: quire:local
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://quire:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/quire
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: quire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: quire
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quire -d quire"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
